version: 2
updates:
  # Keep Maven dependencies up to date
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7 # Wait 7 days for any update
      semver-major-days: 14 # Wait 14 days for major version bumps
    groups:
      # Security fixes that are patch bumps of declared dependencies: merge right away.
      # Minor and major security fixes are not grouped and open as individual PRs.
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
      # Must stay first among the version-update groups: a dependency goes to the first matching group.
      patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
      # Minor updates. Spring Boot and tightly coupled Spring libraries are excluded
      # (and majors are not listed), so they open as individual PRs.
      dev-deps:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
        exclude-patterns:
          - "org.springframework.boot:*"
          - "io.awspring.cloud:*"
          - "com.azure.spring:*"
          - "org.springdoc:*"
      prod-deps:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
        exclude-patterns:
          - "org.springframework.boot:*"
          - "io.awspring.cloud:*"
          - "com.azure.spring:*"
          - "org.springdoc:*"
  # keep used GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"
